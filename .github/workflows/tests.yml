name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov  # Ensure test runners are installed

    - name: Run Tests with pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        pytest
      env:
        # If your app needs specific env vars to run tests, add them here
        FLASK_ENV: testing
        SECRET_KEY: test_key