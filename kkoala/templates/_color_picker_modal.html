<!-- Color Picker Modal -->
<div id="colorPickerModal" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-50 backdrop-blur-sm transition-opacity duration-300" style="display: none;">
    <div class="bg-white dark:bg-zinc-800 rounded-2xl p-6 shadow-2xl w-80 transform transition-all scale-100" onclick="event.stopPropagation();">
        <!-- Header -->
        <div class="flex justify-between items-center mb-5">
            <span class="text-lg font-semibold text-zinc-800 dark:text-white">Farbe wählen</span>
            <button id="cpCloseBtn" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 text-2xl leading-none">&times;</button>
        </div>

        <!-- Color Area -->
        <div class="mb-4">
            <div id="cpColorArea" class="w-full h-36 rounded-lg relative cursor-crosshair shadow-inner select-none" style="background: linear-gradient(to right, #fff, hsl(240, 100%, 50%)); touch-action: none;">
                <div class="absolute inset-0 rounded-lg pointer-events-none" style="background: linear-gradient(to bottom, transparent, #000);"></div>
                <div id="cpColorCursor" class="absolute w-4 h-4 border-2 border-white rounded-full shadow-md cursor-move" style="left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; z-index: 10;"></div>
            </div>
        </div>

        <!-- Hue Slider -->
        <div class="mb-5">
            <div id="cpHueSlider" class="w-full h-4 rounded-full relative cursor-pointer shadow-inner select-none" style="background: linear-gradient(to right, hsl(0, 100%, 50%), hsl(60, 100%, 50%), hsl(120, 100%, 50%), hsl(180, 100%, 50%), hsl(240, 100%, 50%), hsl(300, 100%, 50%), hsl(360, 100%, 50%)); touch-action: none;">
                <div id="cpHueCursor" class="absolute w-2 h-5 bg-white border-2 border-zinc-600 rounded shadow-sm cursor-ew-resize" style="left: 66%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; z-index: 10;"></div>
            </div>
        </div>

        <!-- Presets -->
        <div class="mb-5">
            <div class="text-xs text-zinc-500 dark:text-zinc-400 mb-2 uppercase tracking-wider font-medium">Presets</div>
            <div style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.5rem;">
                {% for color in ['#E74C3C', '#E67E22', '#F1C40F', '#2ECC71', '#1ABC9C', '#3498DB', '#9B59B6', '#34495E', '#C0392B', '#D35400', '#F39C12', '#27AE60', '#16A085', '#2980B9', '#8E44AD', '#2C3E50'] %}
                <div class="cp-preset-color rounded cursor-pointer border-2 border-transparent hover:scale-110 hover:border-zinc-800 dark:hover:border-white transition-transform shadow-sm" style="background-color: {{ color }}; width: 100%; aspect-ratio: 1;" data-color="{{ color }}"></div>
                {% endfor %}
            </div>
        </div>

        <!-- Result & Inputs -->
        <div class="flex gap-3 items-start mb-5">
            <div id="cpResultPreview" class="w-12 h-12 rounded-lg border-2 border-zinc-200 dark:border-zinc-600 shadow-sm" style="background-color: #667EEA;"></div>
            <div class="flex-1">
                <div class="flex items-center bg-zinc-100 dark:bg-zinc-700 rounded-md px-3 h-12 mb-1 border-2 border-zinc-200 dark:border-zinc-600">
                    <span class="text-zinc-500 dark:text-zinc-400 mr-1">#</span>
                    <input type="text" id="cpHexInput" class="bg-transparent border-none w-full font-mono text-zinc-800 dark:text-white uppercase focus:outline-none" value="667EEA" maxlength="6">
                </div>
                <div id="cpRgbDisplay" class="text-xs text-zinc-500 dark:text-zinc-400">RGB: 102, 126, 234</div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex gap-3">
            <button id="cpCancelBtn" class="flex-1 py-2.5 rounded-lg font-semibold text-zinc-600 dark:text-zinc-300 bg-zinc-100 dark:bg-zinc-700 hover:bg-zinc-200 dark:hover:bg-zinc-600 transition-colors">Abbrechen</button>
            <button id="cpConfirmBtn" class="flex-1 py-2.5 rounded-lg font-semibold text-white bg-blue-600 hover:bg-blue-700 shadow-md transition-colors">Wählen</button>
        </div>
    </div>
</div>
